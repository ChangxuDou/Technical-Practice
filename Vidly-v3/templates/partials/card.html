{% load static %}<article class="movie-card"><a class="poster-link" href="{% url 'detail' movie.pk %}"><img class="poster" src="{% static 'posters/' %}{{ movie.artwork }}.svg" alt="{{ movie.title }} Original themed illustration" loading="lazy"><span class="poster-badge">{{ movie.genre.name }}</span><span class="poster-go">↗</span></a><div class="card-meta"><span>{{ movie.release_year }}{% if movie.runtime %} / {{ movie.runtime }} MIN{% endif %}</span><span class="stock-dot {% if not movie.available %}off{% endif %}">{% if movie.available %}Available{% else %}Unavailable{% endif %}</span></div><a class="movie-title" href="{% url 'detail' movie.pk %}">{{ movie.title }}</a><div class="card-bottom"><span><b>€{{ movie.daily_rate }}</b> / day</span><form method="post" action="{% url 'bag_add' movie.pk %}">{% csrf_token %}<button class="add-button" aria-label="Add {{ movie.title }} to rental bag" {% if not movie.available %}disabled{% endif %}>＋</button></form></div></article>
